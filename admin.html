<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración - OLÉ DIFERENTE</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@900&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="css/tienda.css">
    <link rel="stylesheet" href="css/cart.css">
    <style>
        .admin-container {
            max-width: 1000px;
            margin: 120px auto 50px;
            padding: 0 20px;
        }
        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
        }
        .admin-title {
            font-family: 'Playfair Display', serif;
            font-size: 2.5rem;
            color: var(--accent-color);
        }
        .order-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(212, 175, 55, 0.1);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .order-header {
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 15px;
            margin-bottom: 15px;
        }
        .order-id {
            font-weight: 600;
            color: var(--accent-color);
        }
        .order-date {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }
        .order-items {
            margin-bottom: 20px;
        }
        .order-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 0.95rem;
        }
        .order-total {
            font-weight: bold;
            font-size: 1.2rem;
            text-align: right;
            margin-top: 10px;
            color: var(--accent-color);
        }
        .btn-approve {
            background: #27ae60;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }
        .btn-approve:hover {
            background: #219653;
        }
        .btn-reject {
            background: transparent;
            color: #eb5757;
            border: 1px solid #eb5757;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
            margin-left: 10px;
        }
        .btn-reject:hover {
            background: rgba(235, 87, 87, 0.1);
        }

        /* --- Admin Navigation Tabs --- */
        .admin-tabs {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding-bottom: 15px;
        }
        .tab-btn {
            background: transparent;
            border: 1px solid transparent;
            color: var(--text-secondary);
            padding: 12px 24px;
            border-radius: 10px;
            cursor: pointer;
            font-family: inherit;
            font-weight: 600;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
        }
        .tab-btn i {
            width: 18px;
            height: 18px;
        }
        .tab-btn:hover {
            color: var(--text-primary);
            background: rgba(255, 255, 255, 0.03);
        }
        .tab-btn.active {
            color: var(--accent-color);
            background: rgba(212, 175, 55, 0.08);
            border-color: rgba(212, 175, 55, 0.2);
        }
        
        /* Sections toggling */
        .admin-section {
            display: none;
        }
        .admin-section.active {
            display: block;
            animation: fadeInSection 0.4s ease forwards;
        }
        @keyframes fadeInSection {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Message Cards Styling */
        .message-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 20px;
            transition: all 0.3s ease;
            position: relative;
        }
        .message-card.unread {
            border-left: 4px solid var(--accent-color);
            background: rgba(212, 175, 55, 0.02);
        }
        .message-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding-bottom: 12px;
        }
        .message-meta h3 {
            font-size: 1.15rem;
            color: var(--text-primary);
            margin: 0 0 5px 0;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .unread-badge {
            background: var(--accent-color);
            color: #000;
            font-size: 0.75rem;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 20px;
            text-transform: uppercase;
        }
        .message-info {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }
        .message-info a {
            color: var(--text-secondary);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 5px;
            transition: color 0.3s;
        }
        .message-info a:hover {
            color: var(--accent-color);
        }
        .message-date {
            font-size: 0.85rem;
            color: var(--text-secondary);
            text-align: right;
        }
        .message-subject {
            display: inline-block;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 6px;
            padding: 4px 10px;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--accent-color);
            margin-bottom: 12px;
            text-transform: uppercase;
        }
        .message-body {
            font-size: 0.95rem;
            line-height: 1.6;
            color: var(--text-primary);
            background: rgba(0, 0, 0, 0.15);
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            white-space: pre-line;
        }
        .message-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-start;
            align-items: center;
        }
        .btn-action {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-primary);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.88rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s;
        }
        .btn-action:hover {
            background: rgba(255, 255, 255, 0.1);
        }
        .btn-action.read-toggle {
            color: #27ae60;
            border-color: rgba(39, 174, 96, 0.3);
        }
        .btn-action.read-toggle:hover {
            background: rgba(39, 174, 96, 0.1);
        }
        .btn-action.btn-delete {
            color: #eb5757;
            border-color: rgba(235, 87, 87, 0.3);
        }
        .btn-action.btn-delete:hover {
            background: rgba(235, 87, 87, 0.1);
        }
        .btn-action.btn-reply-wa {
            background: #27ae60;
            color: white;
            border: none;
        }
        .btn-action.btn-reply-wa:hover {
            background: #219653;
            transform: translateY(-2px);
        }
    
        /* --- Catalog & Inventory Dashboard Styles --- */
        .catalog-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .catalog-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            overflow: hidden;
        }
        .catalog-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--accent-color), transparent);
        }
        .catalog-card-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
        }
        .catalog-card-header i {
            color: var(--accent-color);
            width: 24px;
            height: 24px;
        }
        .catalog-card-header h3 {
            font-size: 1.15rem;
            margin: 0;
            color: var(--text-primary);
        }
        .catalog-card-desc {
            font-size: 0.9rem;
            color: var(--text-secondary);
            line-height: 1.5;
            margin-bottom: 20px;
        }
        .catalog-stats-row {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }
        .stat-pill {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            padding: 10px 16px;
            display: flex;
            flex-direction: column;
            min-width: 110px;
        }
        .stat-pill-label {
            font-size: 0.75rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 4px;
        }
        .stat-pill-value {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--text-primary);
        }
        .stat-pill-value.gold { color: var(--accent-color); }
        .stat-pill-value.green { color: #27ae60; }
        .stat-pill-value.orange { color: #f39c12; }
        .stat-pill-value.red { color: #eb5757; }

        .btn-drive-link {
            background: #27ae60;
            color: #fff;
            padding: 12px 20px;
            border-radius: 8px;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
            font-size: 0.95rem;
            transition: all 0.3s;
        }
        .btn-drive-link:hover {
            background: #219653;
            transform: translateY(-2px);
        }
        .btn-sync-action {
            background: var(--accent-color);
            color: #000;
            padding: 12px 20px;
            border-radius: 8px;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-weight: 700;
            font-size: 0.95rem;
            border: none;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-sync-action:hover {
            background: #e5c158;
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3);
        }

        .inventory-search-wrap {
            position: relative;
            margin-bottom: 20px;
        }
        .inventory-search-input {
            width: 100%;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-primary);
            padding: 12px 16px 12px 42px;
            border-radius: 10px;
            font-size: 0.95rem;
            box-sizing: border-box;
        }
        .inventory-search-input:focus {
            outline: none;
            border-color: var(--accent-color);
        }
        .inventory-search-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            width: 18px;
            height: 18px;
            color: var(--text-secondary);
        }

        .inventory-table-container {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            overflow-x: auto;
        }
        .inventory-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.92rem;
            text-align: left;
        }
        .inventory-table th {
            background: rgba(255, 255, 255, 0.04);
            padding: 14px 18px;
            color: var(--text-secondary);
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.78rem;
            letter-spacing: 1px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }
        .inventory-table td {
            padding: 14px 18px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            color: var(--text-primary);
        }
        .inventory-table tr:hover td {
            background: rgba(255, 255, 255, 0.02);
        }
        .badge-status {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.78rem;
            font-weight: 700;
            text-transform: uppercase;
        }
        .badge-status.instock {
            background: rgba(39, 174, 96, 0.15);
            color: #27ae60;
            border: 1px solid rgba(39, 174, 96, 0.3);
        }
        .badge-status.preorder {
            background: rgba(243, 156, 18, 0.15);
            color: #f39c12;
            border: 1px solid rgba(243, 156, 18, 0.3);
        }
        .badge-status.outofstock {
            background: rgba(235, 87, 87, 0.15);
            color: #eb5757;
            border: 1px solid rgba(235, 87, 87, 0.3);
        }

    </style>
    <!-- Supabase JS Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <header></header>
    
    <div class="admin-container">
        <div class="admin-header">
            <h1 class="admin-title" id="admin-page-title">Pedidos Recientes</h1>
        </div>

        <!-- Pestañas de Navegación -->
        <div class="admin-tabs">
            <button id="tab-orders" class="tab-btn active" onclick="adminPanel.switchTab('orders', this)">
                <i data-lucide="shopping-bag"></i>
                <span>Pedidos Recientes</span>
            </button>
            <button id="tab-messages" class="tab-btn" onclick="adminPanel.switchTab('messages', this)">
                <i data-lucide="mail"></i>
                <span>Mensajes de Contacto</span>
            </button>
            <button id="tab-catalog" class="tab-btn" onclick="adminPanel.switchTab('catalog', this)">
                <i data-lucide="database"></i>
                <span>Catálogo y Precios</span>
            </button>
        </div>

        <!-- Sección de Pedidos -->
        <div id="orders-section" class="admin-section active">
            <div id="orders-container">
                <p style="text-align: center; color: var(--text-secondary);">Cargando pedidos...</p>
            </div>
        </div>


        <!-- Sección de Catálogo y Precios -->
        <div id="catalog-section" class="admin-section">
            <div id="catalog-container">
                <p style="text-align: center; color: var(--text-secondary);">Cargando catálogo...</p>
            </div>
        </div>

        <!-- Sección de Mensajes de Contacto -->
        <div id="messages-section" class="admin-section">
            <div id="messages-container">
                <p style="text-align: center; color: var(--text-secondary);">Cargando mensajes...</p>
            </div>
        </div>
    </div>

    <footer></footer>
    <script src="js/supabase-config.js"></script>
    <script src="js/components.js?v=2"></script>
    <script src="js/cart.js?v=2"></script>
    <script src="js/admin.js?v=3"></script>
</body>
</html>
