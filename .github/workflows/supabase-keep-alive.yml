name: Supabase Keep-Alive

on:
  schedule:
    # Se ejecuta lunes, miércoles y viernes a las 12:00 UTC para evitar que pasen 7 días de inactividad
    - cron: '0 12 * * 1,3,5'
  workflow_dispatch: # Permite ejecutarlo manualmente desde la pestaña 'Actions' de GitHub

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Database
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://bhrxmevodepoxkdesqvq.supabase.co' }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJocnhtZXZvZGVwb3hrZGVzcXZxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgzMzg0ODgsImV4cCI6MjA5MzkxNDQ4OH0.A-mYCWnT0O-QXVj31WK8J6JrD2Z1fMpt7dgGkiCmTZM' }}
        run: |
          echo "Ejecutando ping a la base de datos de Supabase..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/rest/v1/profiles?select=id&limit=1")
          
          echo "Código de respuesta HTTP: $HTTP_STATUS"
          if [ "$HTTP_STATUS" -eq 200 ] || [ "$HTTP_STATUS" -eq 206 ]; then
            echo "Ping exitoso. La base de datos de Supabase permanece activa."
          else
            echo "Respuesta inesperada: $HTTP_STATUS"
            exit 1
          fi
