name: Sincronizar Catalogo desde Google Drive

on:
  schedule:
    # Se ejecuta automáticamente cada 2 horas
    - cron: '0 */2 * * *'
  workflow_dispatch: # Permite ejecutarlo manualmente con 1 clic desde GitHub
  repository_dispatch:
    types: [sync_catalog]

permissions:
  contents: write

jobs:
  sync-catalog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias
        run: npm install

      - name: Ejecutar sincronizacion desde Google Drive
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://bhrxmevodepoxkdesqvq.supabase.co' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJocnhtZXZvZGVwb3hrZGVzcXZxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgzMzg0ODgsImV4cCI6MjA5MzkxNDQ4OH0.A-mYCWnT0O-QXVj31WK8J6JrD2Z1fMpt7dgGkiCmTZM' }}
        run: node actualizar_web_desde_excel.js --drive

      - name: Verificar cambios y subir a GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Catalogo_Perfumes_Ole_Diferente.xlsx tienda.html productos/
          if ! git diff --staged --quiet; then
            git commit -m "Sincronizacion automatica de catalogo desde Google Drive"
            git push
            echo "Cambios subidos a GitHub exitosamente."
          else
            echo "No se detectaron cambios en los precios ni en el stock."
          fi
